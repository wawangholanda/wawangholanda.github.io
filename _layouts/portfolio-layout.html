<!DOCTYPE html>
<html>
<head>
<title>Portfolio</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ '/assets/css/w3.css' | relative_url }}">
<link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Roboto'>
<link rel="stylesheet" href="{{ '/assets/css/font-awesome.min.css' | relative_url }}">  
<style>
html,body,h1,h2,h3,h4,h5,h6 {font-family: "Roboto", sans-serif}

/* CSS Kustom Background Foto */
.bg-photo-local {
  background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                    url("{{ '/assets/images/portfolio-bg.jpg' | relative_url }}");
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  background-attachment: fixed;
  min-height: 100vh;
}


/* Style Dasar Tombol Back to Top & Home */
a.btn-top-responsive,
a.btn-home-responsive,
a.btn-top-responsive:link,
a.btn-home-responsive:link,
a.btn-top-responsive:visited,
a.btn-home-responsive:visited,
a.btn-top-responsive:focus,
a.btn-home-responsive:focus,
a.btn-top-responsive:active,
a.btn-home-responsive:active {
  background-color: #f2ff00 !important;
  color: #000000 !important;
  box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  z-index: 9999;
  position: fixed;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

/* Posisi Tombol Home (Kiri) */
.btn-home-responsive {
  left: 20px;
}

/* Posisi Tombol Top (Kanan) */
.btn-top-responsive {
  right: 20px;
}

/* Responsif Posisi Atas/Bawah */
@media (max-width: 600px) {
  .btn-top-responsive,
  .btn-home-responsive { 
    bottom: 20px; 
  }
}
@media (min-width: 601px) {
  .btn-top-responsive,
  .btn-home-responsive { 
    top: 20px; 
  }
}

/* Hover Hitam HANYA Aktif di Laptop/Desktop yang Pakai Mouse */
@media (hover: hover) and (pointer: fine) {
  a.btn-top-responsive:hover,
  a.btn-home-responsive:hover {
    background-color: #000000 !important;
    color: #ffffff !important;
  }
}
</style>
</head>
<body class="bg-photo-local">

<!-- Tombol Home -->
<a href="{{ '/' | relative_url }}" class="btn-home-responsive w3-button w3-circle" title="Kembali ke Beranda" onclick="this.blur();">
  <i class="fa fa-home"></i>
  <span class="w3-hide-small"> Back to Homepage</span>
</a>

<!-- Tombol Top -->
<a href="javascript:void(0)" class="btn-top-responsive w3-button w3-circle" title="Kembali ke Atas" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); this.blur();">
  <i class="fa fa-arrow-up"></i>
  <span class="w3-hide-small"> Back to Top</span>
</a>

<div style="padding-top: 50px;">
  {{ content }}
</div>

</body>
</html>
