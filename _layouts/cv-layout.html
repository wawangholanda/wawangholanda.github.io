<!DOCTYPE html>
<html>
<head>
  <title>Curriculum Vitae</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="stylesheet" href="{{ '/assets/css/w3.css' | relative_url }}">  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">
  <link rel="stylesheet" href="{{ '/assets/css/font-awesome.min.css' | relative_url }}">  
  
  <style>
    html, body, h1, h2, h3, h4, h5, h6 {
      font-family: "Roboto", sans-serif;
    }

    /* CSS Kustom Background Foto */
    .bg-photo-local {
      background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url("{{ '/assets/images/portfolio-bg.jpg' | relative_url }}");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      min-height: 100vh;
    }

    /* Style Tombol Back to Top */
    .btn-top-responsive {
      position: fixed;
      right: 20px;
      z-index: 9999;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      background-color: #212121 !important; /* Warna background gelap */
      color: #ffffff !important;           /* Warna teks/ikon putih */
    }
    .btn-top-responsive:hover {
      background-color: #000000 !important; /* Warna saat tombol di-hover/disorot */
      color: #ffffff !important;
    } 
    @media (max-width: 600px) {
      .btn-top-responsive { bottom: 20px; }
    }
    @media (min-width: 601px) {
      .btn-top-responsive { top: 20px; }
    }

    /* Style Tombol Back to Homepage */
    .btn-home-responsive {
      position: fixed;
      left: 20px;
      z-index: 9999;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      background-color: #212121 !important; /* Warna background gelap */
      color: #ffffff !important;           /* Warna teks/ikon putih */
    }
    .btn-home-responsive:hover {
      background-color: #000000 !important; /* Warna saat tombol di-hover/disorot */
      color: #ffffff !important;
    }
    @media (max-width: 600px) {
      .btn-home-responsive { bottom: 20px; }
    }
    @media (min-width: 601px) {
      .btn-home-responsive { top: 20px; }
    }
  </style>
</head>
<body class="bg-photo-local">

  <a href="{{ '/' | relative_url }}" class="btn-home-responsive w3-button w3-theme-d4 w3-hover-theme w3-circle" title="Kembali ke Beranda">
    <i class="fa fa-home"></i>
    <span class="w3-hide-small"> Back to Homepage</span>
  </a>

  <a href="#" class="btn-top-responsive w3-button w3-theme-d4 w3-hover-theme w3-circle" title="Kembali ke Atas">
    <i class="fa fa-arrow-up"></i>
    <span class="w3-hide-small"> Back to Top</span>
  </a>

  {{ content }}

</body>
</html>
