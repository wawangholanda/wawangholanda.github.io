<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>

  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    .main-bg-custom {
      background-image: linear-gradient(rgba(0, 0, 0, 0.70), rgba(0, 0, 0, 0.70)), 
                        url('https://images.unsplash.com/photo-1558494949-ef010cbdcc31?q=80&w=1920');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
      padding: 32px;
      border-radius: 8px;
    }
  </style>
</head>
<body class="w3-light-grey">

  <main class="w3-content main-bg-custom" style="max-width:1200px;">
    {{ content }}
  </main>

  <footer class="w3-container w3-padding-32 w3-center w3-black w3-margin-top">
    <p>&copy; {{ 'now' | date: "%Y" }} Wawang Holanda. Powered by <a href="https://pages.github.com/" target="_blank" class="w3-hover-text-green">GitHub Pages</a> & Jekyll.</p>
  </footer>

</body>
</html>
