<!DOCTYPE html>
<html>
<head>
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.name }}</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Pustaka CSS Utama -->
  <link rel="stylesheet" href="https://w3schools.com">
  <link rel="stylesheet" href="https://googleapis.com">
  <link rel="stylesheet" href="https://cloudflare.com">
  
  <style>
    body, h1, h2, h3, h4, h5, h6 { font-family: "Montserrat", sans-serif; }
    /* Menghilangkan margin bawaan jekyll-now jika ada */
    .container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
  </style>
</head>
<body style="background: #111827;">

  <!-- ================= NAVIGASI BAR ATAS ================= -->
  <div class="w3-top" style="z-index: 9999;">
    <div class="w3-bar w3-black w3-card w3-large">
      <!-- Tombol Menu Mobile (Hanya muncul di HP) -->
      <a class="w3-bar-item w3-button w3-hide-medium w3-hide-large w3-right w3-padding-large w3-hover-white w3-large w3-black" href="javascript:void(0);" onclick="toggleMobileMenu()"><i class="fa fa-bars"></i></a>
      
      <!-- Link Navigasi -->
      <a href="/" class="w3-bar-item w3-button w3-padding-large w3-teal"><i class="fa fa-home"></i> Home</a>
      <a href="/cv/" class="w3-bar-item w3-button w3-hide-small w3-padding-large w3-hover-white">CV</a>
      <a href="/portofolio/" class="w3-bar-item w3-button w3-hide-small w3-padding-large w3-hover-white">Portfolio</a>
      <a href="/certificates/" class="w3-bar-item w3-button w3-hide-small w3-padding-large w3-hover-white">Certificates</a>
      <a href="/uses/" class="w3-bar-item w3-button w3-hide-small w3-padding-large w3-hover-white">Uses</a>
    </div>

    <!-- Navigation Bar Mobile (Menu Dropdown HP) -->
    <div id="navMobile" class="w3-bar-block w3-black w3-hide w3-hide-large w3-hide-medium w3-large">
      <a href="/cv/" class="w3-bar-item w3-button w3-padding-large">CV</a>
      <a href="/portofolio/" class="w3-bar-item w3-button w3-padding-large">Portfolio</a>
      <a href="/certificates/" class="w3-bar-item w3-button w3-padding-large">Certificates</a>
      <a href="/uses/" class="w3-bar-item w3-button w3-padding-large">Uses</a>
    </div>
  </div>

  <!-- Spacer agar konten tidak tertutup Navbar -->
  <div style="margin-top:54px;"></div>

  <!-- ================= KONTEN HALAMAN ================= -->
  <div class="container">
    {{ content }}
  </div>

  <!-- Skrip Kontrol Menu HP -->
  <script>
  function toggleMobileMenu() {
    var x = document.getElementById("navMobile");
    if (x.className.indexOf("w3-show") == -1) {
      x.className += " w3-show";
    } else { 
      x.className = x.className.replace(" w3-show", "");
    }
  }
  </script>

</body>
</html>
