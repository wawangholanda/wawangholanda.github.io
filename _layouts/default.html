<!DOCTYPE html>
<html lang="id">
<head>
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description" content="Portofolio DevOps, Cloud, & Infrastructure Engineering" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />

  <meta property="og:image" content="{{ '/assets/images/preview.jpg' | absolute_url }}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="627" />  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>

  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    .bg-custom {
      /* Overlay hitam transparan + Pemanggilan foto dari folder lokal Jekyll */
      background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), 
                        url("{{ '/assets/images/bg.jpg' | relative_url }}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #ffffff; /* Mengubah warna teks default agar kontras dan mudah dibaca */
    }
    .hero-bg-photo {
      /* Ganti URL gambar dengan path lokal Anda dan gunakan filter Liquid relative_url */
      background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('{{ "/assets/images/hero-bg.jpg" | relative_url }}');
      background-size: cover; /* Memastikan gambar menutupi area */
      background-position: center; /* Mengetengahkan gambar */
      background-repeat: no-repeat; /* Mencegah gambar berulang */
    }    
  </style>
  
</head>
<body class="bg-custom">

  <main class="w3-content" style="max-width:1200px;">
    {{ content }}
  </main>

{% include footer.html %}

</body>
</html>
